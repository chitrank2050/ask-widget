version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    reviewers:
      - chitrank2050
    labels:
      - dependencies
    groups:
      # Capture all minor and patch updates in one PR to save CI minutes
      patch-and-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - ci
    groups:
      # Group all action version bumps like v4 -> v5 together
      all-actions:
        patterns:
          - "*"
