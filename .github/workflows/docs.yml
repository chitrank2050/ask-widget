# =============================================================
# Documentation Deployment 📖
#
# Automatically builds and deploys VitePress docs to GitHub Pages.
# Triggered on pushes to 'main' affecting documentation or manually.
# =============================================================

name: Documentation 📖

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/docs-deploy.sh'
      - 'package.json'
  workflow_dispatch:

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: read

jobs:
  deploy:
    name: Deploy Docs 🌐
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository 📥
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create Bot Token 🤖🔑
        id: generate_token
        uses: ./.github/actions/setup-bot
        with:
          client-id: ${{ secrets.CHITRANK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHITRANK_BOT_PRIVATE_KEY }}

      - name: Configure Authenticated Git 🔧
        env:
          TOKEN: ${{ steps.generate_token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}"

      - name: Install pnpm 📦
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js 🟢
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies 📥
        run: pnpm install --frozen-lockfile --prefer-offline

      # Match the Meterplex "Transient Docs" pattern
      # Source stays at root, but CI copies it to docs/ for the build
      - name: Copy transient docs 📝
        run: |
          cp CHANGELOG.md docs/changelog.md
          if [ -f CODE_OF_CONDUCT.md ]; then cp CODE_OF_CONDUCT.md docs/code-of-conduct.md; fi

      - name: Build Documentation 🏗️
        run: pnpm run docs:build

      - name: Deploy to GitHub Pages 🚀
        run: |
          git config user.name "chitrank-actions[bot]"
          git config user.email "actions@github.com"
          npx gh-pages -d docs/.vitepress/dist -m "docs: deploy automated build"
