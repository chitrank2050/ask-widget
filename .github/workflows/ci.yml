# =============================================================
# CI: Continuous Integration 🌊
#
# Validates every PR and push to main.
# Includes: Typechecking, Linting, Testing, and Build Verification.
# =============================================================

name: CI 🌊

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.vscode/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.vscode/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build & Test 🧪
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout 📥
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm 📦
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - name: Setup Node.js 🟢
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Git Hygiene (PR Title) 🌊
        if: github.event_name == 'pull_request'
        uses: chitranklabs/git-hygiene@7cd725abdbcd12d0e14b77fa94c423dd9ddf8933
        with:
          command: 'title'
          value: ${{ github.event.pull_request.title }}

      - name: Secret Scan (Gitleaks) 🔑
        run: |
          VERSION="8.18.2"
          curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/
          gitleaks detect --source . --verbose --redact --staged

      - name: Install dependencies 🛠️
        run: pnpm install --frozen-lockfile

      - name: Typecheck 🔍
        run: pnpm run typecheck

      - name: Lint 🧼
        run: pnpm run lint

      - name: Run tests 🧪
        run: pnpm run test

      - name: Verify build 🏗️
        run: pnpm run build
