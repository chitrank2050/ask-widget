# =============================================================
# Release Finalize: Publishing 🌐
#
# Triggers when a new GitHub Release is created.
# Publishes the package to NPM and deploys documentation.
# =============================================================

name: Release Finalize 🌐

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to NPM & Deploy Docs 🚀
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout 📥
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install pnpm 📦
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - name: Setup Node.js 🟢
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies 🛠️
        run: pnpm install --frozen-lockfile

      - name: Build Library 🏗️
        run: pnpm run build:lib

      - name: Publish to NPM 📦
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Deploy Docs 📄
        run: pnpm run deploy:docs
