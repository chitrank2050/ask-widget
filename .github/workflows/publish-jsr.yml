# =============================================================
# JSR Publication Lab 🦖
#
# Manually trigger this to test JSR publishing stability.
# This uses OIDC authentication (no tokens required if configured in JSR).
#
# Triggers:
#   - Manual dispatch
# =============================================================

name: 🦖 JSR Publication Lab

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use package.json)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write # Required for JSR OIDC publishing

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish to JSR 🚀
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout repository 📥
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Deno 🦕
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Setup Node.js 🟢
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Sync Version 🔄
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # Robust extraction: find the first version-like string (X.Y.Z)
          RAW_INPUT="$INPUT_VERSION"
          if [ -z "$RAW_INPUT" ]; then
            RAW_INPUT=$(jq -r .version package.json)
          fi

          # Extract only the semantic version part
          VERSION=$(echo "$RAW_INPUT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-.*)?' | head -1)

          if [ -z "$VERSION" ]; then
            echo "❌ Error: Could not extract valid version from: $RAW_INPUT"
            exit 1
          fi

          echo "Syncing JSR version to: $VERSION"
          jq ".version = \"$VERSION\"" jsr.json > jsr.json.tmp && mv jsr.json.tmp jsr.json

      - name: Setup pnpm 📦
        uses: pnpm/action-setup@a7487c7e483d997ca0ac467da3f7853c8f6822a6 # v5.0.0

      - name: Install dependencies 📥
        run: pnpm install --no-frozen-lockfile

      - name: Publish 📦
        run: npx jsr publish --allow-dirty
