# =============================================================
# Lefthook: Git Hooks Manager 🥊
#
# Powered by git-hygiene 🌊
# Reference: https://github.com/chitranklabs/git-hygiene
# =============================================================

pre-commit:
  parallel: true
  commands:
    # 1. Block commits that contain secrets/credentials
    secrets:
      run: gitleaks protect --staged --redact -v

    # 2. TS/TSX - ESLint + Prettier
    lint-ts:
      glob: 'src/**/*.{ts,tsx}'
      run: pnpm exec eslint {staged_files} --fix && pnpm exec prettier --write {staged_files}
      stage_fixed: true

    # 3. Markdown files - markdownlint fix + Prettier format
    lint-md:
      glob: '*.md'
      run: pnpm exec markdownlint --fix {staged_files} && pnpm exec prettier --write {staged_files}
      stage_fixed: true

    # 4. Styles - Prettier format only
    format-styles:
      glob: '**/*.{css,scss}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

    # 5. JSON / YAML - Prettier format only
    lint-json-yml:
      glob: '*.{json,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

    # 6. GitHub Actions - Security linting
    lint-actions:
      glob: '.github/workflows/*.yml'
      run: if command -v zizmor > /dev/null; then zizmor {staged_files}; else echo "zizmor not found, skipping actions lint. Install with 'brew install zizmor'"; fi

commit-msg:
  commands:
    # Enforce Conventional Commits via git-hygiene
    git-hygiene:
      run: pnpm exec git-hygiene commit {1}

pre-push:
  parallel: true
  commands:
    # Ensure branch naming follows standards
    branch-name:
      run: pnpm exec git-hygiene branch

    # Run tests before pushing
    test:
      run: pnpm run test

    # Ensure types are correct
    typecheck:
      run: pnpm run typecheck
